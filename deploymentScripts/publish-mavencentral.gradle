apply plugin: 'maven-publish'
apply plugin: 'signing'

group = 'com.datatheorem.android.trustkit'

android {
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

// AGP only creates components.release after the project is evaluated.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'trustkit'
                pom {
                    name = 'trustkit'
                    description = 'TrustKit Android is an open source library that makes it easy to deploy SSL public key pinning and reporting in any Android App.'
                    url = 'https://github.com/datatheorem/TrustKit-Android'
                    licenses {
                        license {
                            name = 'The MIT License (MIT)'
                            url = 'https://github.com/datatheorem/TrustKit-Android/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'nabla-c0d3'
                            name = 'Alban Diquet'
                            email = 'ad@datatheorem.io'
                        }
                        developer {
                            id = 'jobot0'
                            name = 'Jordan Bouellat'
                            email = 'jb@datatheorem.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/datatheorem/TrustKit-Android.git'
                        developerConnection = 'scm:git:github.com/datatheorem/TrustKit-Android.git'
                        url = 'https://github.com/datatheorem/TrustKit-Android'
                    }
                }
            }
        }

        repositories {
            // Reads the mavenCentralUsername and mavenCentralPassword Gradle properties (Central Portal user token).
            maven {
                name = 'mavenCentral'
                url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
                credentials(PasswordCredentials)
            }
        }
    }

    signing {
        def signingKey = findProperty('signingInMemoryKey')
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, findProperty('signingInMemoryKeyPassword'))
        }
        // Local and CI publishes stay unsigned. A Maven Central upload fails without a key.
        required { gradle.taskGraph.allTasks.any { it.name.endsWith('ToMavenCentralRepository') } }
        sign publishing.publications.release
    }
}
