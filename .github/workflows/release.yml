name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Maven Central releases cannot be undone. Never cancel or overlap them.
concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/verify_release_version.sh "$GITHUB_REF_NAME"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release bundle
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./scripts/build_release_bundle.sh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # Attach first: this step can be re-run, but the Maven Central upload cannot.
      - run: gh release upload "$GITHUB_REF_NAME" output/trustkit-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ./scripts/publish_maven_central.sh
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
