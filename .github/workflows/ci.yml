name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets release.yml run these checks on the release tag before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: ./gradlew spotlessCheck lint
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: ./gradlew :trustkit:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-reports
          path: trustkit/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  script-tests:
    name: Script tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/test_publish_maven_central.sh

  release-bundle:
    name: Build release bundle
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: ./scripts/build_release_bundle.sh

  demo:
    name: Build demo ${{ matrix.module }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [app, demoappkotlin]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: ./gradlew :${{ matrix.module }}:assembleDebug

  instrumentation-tests:
    name: Instrumentation tests (API ${{ matrix.api-level }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: ./scripts/enable_kvm.sh
      - uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          script: ./gradlew :trustkit:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            trustkit/build/reports/androidTests/**
            trustkit/build/outputs/androidTest-results/**
            trustkit/build/outputs/managed_device_android_test_additional_output/**
          if-no-files-found: ignore
          retention-days: 7
