// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.25'

    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}


ext{
    trustkitVersionCode = 10
    trustkitVersionName = "1.1.5"

    demoAppTrustKitVersionCode = 2
    demoAppTrustKitVersionName = "1.1"

    demoAppKotlinTrustKitVersionCode = 2
    demoAppKotlinTrustKitVersionName = "1.1"
    javaSourceCompatibilty = '11'
    toolVersions = [
            android : [
                    compileSdk : 36,
                    minSdk : 15,
                    targetSdk: 36
            ]
    ]

    libVersions = [
        junit: '4.12',
        mockito : [
                android: '1.10.19'
        ],
        dexmaker : '1.4',
        androidx : [
            annotation: '1.0.0',
            test: '1.1.0',
            legacySupport: '1.0.0',
            appcompat: '1.0.2',
            preference: '1.0.0'
        ],
        testing: [
                okhttp3: '3.11.0',
                'playServicesBase': '11.0.0',
        ],
        google: [
                material: '1.0.0'
        ],
        squareup: [
                okhttp3: '3.11.0',
                okhttp2: '2.4.0'
        ]
    ]

}
