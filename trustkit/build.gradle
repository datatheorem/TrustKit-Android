plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'maven-publish'
    id 'signing'
}

group = 'com.datatheorem.android.trustkit'
version = libs.versions.trustkitVersionName.get()

android {
    namespace = 'com.datatheorem.android.trustkit'
    compileSdkVersion libs.versions.compileSdk.get().toInteger()

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdkVersion libs.versions.minSdk.get().toInteger()
        versionCode libs.versions.trustkitVersionCode.get().toInteger()
        versionName project.version.toString()
        buildConfigField 'String', 'VERSION_NAME', "\"${project.version}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(libs.versions.jvmTarget.get())
        targetCompatibility JavaVersion.toVersion(libs.versions.jvmTarget.get())
    }

    kotlinOptions {
        jvmTarget = libs.versions.jvmTarget.get()
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation libs.androidx.annotation
    implementation libs.androidx.preference
    compileOnly libs.okhttp3
    compileOnly libs.okhttp2
    testImplementation libs.junit
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.mockito.core
    androidTestImplementation libs.awaitility
    androidTestImplementation libs.dexmaker.core
    androidTestImplementation libs.dexmaker.dx
    androidTestImplementation libs.dexmaker.mockito
    androidTestImplementation libs.okhttp3
    androidTestImplementation libs.google.play.services.base
}

// AGP only creates components.release after the project is evaluated.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'trustkit'
                pom {
                    name = 'trustkit'
                    description = 'TrustKit Android is an open source library that makes it easy to deploy SSL public key pinning and reporting in any Android App.'
                    url = 'https://github.com/datatheorem/TrustKit-Android'
                    licenses {
                        license {
                            name = 'The MIT License (MIT)'
                            url = 'https://github.com/datatheorem/TrustKit-Android/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'nabla-c0d3'
                            name = 'Alban Diquet'
                            email = 'ad@datatheorem.io'
                        }
                        developer {
                            id = 'jobot0'
                            name = 'Jordan Bouellat'
                            email = 'jb@datatheorem.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/datatheorem/TrustKit-Android.git'
                        developerConnection = 'scm:git:github.com/datatheorem/TrustKit-Android.git'
                        url = 'https://github.com/datatheorem/TrustKit-Android'
                    }
                }
            }
        }

        repositories {
            // scripts/build_release_bundle.sh zips this repository for GitHub and Maven Central.
            maven {
                name = 'releaseBundle'
                url = layout.buildDirectory.dir('release-bundle')
            }
        }
    }

    def signingKey = providers.environmentVariable('SIGNING_KEY').orNull
    if (signingKey) {
        signing {
            useInMemoryPgpKeys(signingKey, providers.environmentVariable('SIGNING_KEY_PASSWORD').orNull)
            sign publishing.publications.release
        }
    }
}
